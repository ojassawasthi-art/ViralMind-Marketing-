services:
  app:
    build: { context: .., dockerfile: Dockerfile }
    environment:
      MASTER_KEY: "${MASTER_KEY:?set MASTER_KEY in .env (openssl rand -base64 32)}"
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.1:8b}"
      ALLOW_PAID_PROVIDERS: "${ALLOW_PAID_PROVIDERS:-false}"
    ports: ["127.0.0.1:3000:3000"]   # bind to localhost; put a TLS reverse proxy in front for remote access
    depends_on: [ollama]
  ollama:
    image: ollama/ollama
    volumes: [ollama:/root/.ollama]
    # Local models need RAM/VRAM: ~8 GB RAM minimum for 7-8B quantised models; CPU-only is slow.
  db:
    image: postgres:16
    profiles: ["postgres"]           # not used by the app yet (in-memory store); for migration development
    environment: { POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-me}", POSTGRES_DB: viralmind }
    volumes: [pgdata:/var/lib/postgresql/data]
volumes: { pgdata: {}, ollama: {} }
